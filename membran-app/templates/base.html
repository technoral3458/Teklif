<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Membran Kapak Yönetim Sistemi{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
  <nav class="bg-slate-900 text-white shadow-lg sticky top-0 z-40 print:hidden">
    <div class="max-w-7xl mx-auto px-4 flex items-center gap-1 h-14">
      <span class="font-bold text-lg mr-4">🚪 Membran Kapak</span>
      {% set nav = request.url.path %}
      <a href="/membrane" class="px-3 py-2 rounded hover:bg-slate-700 {% if nav.startswith('/membrane') and not nav.startswith('/membrane/caps') and not nav.startswith('/membrane/jobs') %}bg-slate-700{% endif %}">Maliyet</a>
      <a href="/membrane/caps" class="px-3 py-2 rounded hover:bg-slate-700 {% if nav.startswith('/membrane/caps') %}bg-slate-700{% endif %}">Kapak Modelleri</a>
      <a href="/membrane/jobs" class="px-3 py-2 rounded hover:bg-slate-700 {% if nav.startswith('/membrane/jobs') %}bg-slate-700{% endif %}">Nesting</a>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>{{ t.ad or 'Dolap' }} — {{ firma().ad }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
<script src="/static/kabin_cizim.js"></script>
<script src="/static/kabin_gercek.js"></script>
<style>
  :root { --dock: 92px; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #sahne { position: absolute; inset: 56px 0 calc(var(--dock) + env(safe-area-inset-bottom)) 0; }
  #s2, #v3 { position: absolute; inset: 0; }
  #s2 { width: 100%; height: 100%; touch-action: manipulation; user-select: none; }
  #s2 .goz, #s2 .parca, #s2 .olcu { cursor: pointer; }
  #s2 .olcu { font-family: inherit; font-weight: 600; }
  #v3 > canvas { display: block; }
  .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
              min-width: 72px; height: 68px; border-radius: 18px; font-size: 12px; font-weight: 600; color: #0f172a;
              background: #f1f5f9; transition: transform .08s, background .15s; flex: 1 0 auto; padding: 0 8px; }
  .dock-btn:active { transform: scale(.96); }
  .dock-btn svg { width: 26px; height: 26px; }
  .dock-btn.ana { background: #059669; color: #fff; }
  .dock-btn.tehlike { background: #fef2f2; color: #b91c1c; }
  .dock-btn:disabled { opacity: .35; }
  #sayfa { transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  #sayfa.acik { transform: none; }
  #perde { opacity: 0; pointer-events: none; transition: opacity .2s; }
  #perde.acik { opacity: 1; pointer-events: auto; }
  .seg { display: flex; background: #f1f5f9; border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; height: 44px; border-radius: 10px; font-weight: 600; font-size: 14px; color: #475569; }
  .seg button.sec { background: #fff; color: #047857; box-shadow: 0 1px 3px #0002; }
  .adim { display: flex; align-items: center; gap: 10px; }
  .adim button { width: 48px; height: 48px; border-radius: 14px; background: #f1f5f9; font-size: 24px; font-weight: 600; color: #0f172a; flex: none; }
  .adim button:active { background: #e2e8f0; }
  .adim input { flex: 1; min-width: 0; height: 48px; text-align: center; font-size: 20px; font-weight: 700; border: 2px solid #e2e8f0; border-radius: 14px; }
  .etiket { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .kart-sec { border: 2px solid #e2e8f0; border-radius: 16px; padding: 10px; text-align: center; font-size: 13px; font-weight: 600; background: #fff; }
  .kart-sec.sec { border-color: #10b981; background: #ecfdf5; color: #047857; }
  .yuzer { box-shadow: 0 4px 16px #0f172a1f; }
  #panel { display: none; }
  .kulp-kapak { position: relative; width: 112px; height: 168px; border: 2px solid #cbd5e1; border-radius: 10px; background: #f8fafc; flex: none; }
  .kulp-kapak.ayna { transform: scaleX(-1); }
  .kulp-kapak .mentese { position: absolute; left: 5px; width: 9px; height: 9px; border-radius: 99px; border: 1.5px solid #94a3b8; }
  .kulp-kapak [data-kulpyer] { position: absolute; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 10px; display: grid; place-items: center; }
  .kulp-kapak [data-kulpyer]:hover { background: #e2e8f0; }
  .kulp-kapak [data-kulpyer] i { display: block; background: #cbd5e1; border-radius: 3px; }
  .kulp-kapak [data-kulpyer].sec { background: #d1fae5; }
  .kulp-kapak [data-kulpyer].sec i { background: #059669; }
  .kulp-kapak.yatay [data-kulpyer] i { width: 24px; height: 5px; }
  .kulp-kapak.dikey [data-kulpyer] i { width: 5px; height: 24px; }
  .p-baslik { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #94a3b8; margin-bottom: 10px; }
  .p-arac { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .p-arac .dock-btn { min-width: 0; height: 68px; padding: 0 4px; }
  #pOlcu .adim button { width: 40px; height: 40px; font-size: 20px; border-radius: 12px; }
  #pOlcu .adim input { height: 40px; font-size: 17px; border-radius: 12px; }
  #pOlcu .seg button { height: 36px; font-size: 13px; }
  #pOlcu .etiket { margin-bottom: 4px; font-size: 12px; }
  .vurgu { animation: vurgu 1.6s ease 2; border-radius: 16px; }
  @keyframes vurgu { 50% { box-shadow: 0 0 0 4px #10b98155; } }
  @media (min-width: 1024px) {
    #sahne { right: 400px; bottom: 0; }
    #dock, .yalniz-mobil { display: none !important; }
    #panel { display: flex; }
    #sayfa { left: auto; right: 0; top: 56px; bottom: 0; width: 400px; max-height: none; border-radius: 0;
             transform: translateX(105%); box-shadow: -16px 0 40px #0f172a1f; }
    #sayfa.genis { width: 640px; }
    #sayfa.acik { transform: none; }
    #sayfa .tutamak { display: none; }
    #perde { display: none; }
    #tost { bottom: 28px !important; left: calc(50% - 200px) !important; }
    #s2 .goz:hover { fill: rgba(16, 185, 129, .09); }
  }
  .renk-kart { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 16px; border: 2px solid transparent; font-size: 12px; font-weight: 600; color: #334155; }
  .renk-kart .renk { width: 52px; height: 52px; border-radius: 999px; box-shadow: inset 0 0 0 1px #0000001f, 0 2px 6px #0f172a26; background-size: 220% 220%; }
  .renk-kart.sec { border-color: #10b981; background: #ecfdf5; color: #047857; }
</style>
</head>
<body class="bg-stone-100 text-slate-900">

<!-- Üst çubuk -->
<header class="fixed top-0 inset-x-0 h-14 bg-white/95 backdrop-blur border-b z-30 flex items-center gap-2 px-2">
  <a href="{{ geri_url }}" class="w-10 h-10 grid place-items-center rounded-full hover:bg-slate-100" aria-label="Geri">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></a>
  <input id="ad" value="{{ t.ad }}" aria-label="Dolap adı" class="flex-1 min-w-0 font-semibold text-[17px] bg-transparent outline-none truncate">
  <span id="fiyat" class="hidden text-emerald-700 font-bold text-[15px] whitespace-nowrap"></span>
  <button id="sepetBtn" class="yalniz-mobil h-10 px-4 rounded-full bg-emerald-600 text-white font-semibold text-sm whitespace-nowrap disabled:opacity-40">Sepete ekle</button>
</header>

<!-- Sahne -->
<main id="sahne">
  <svg id="s2" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="v3" class="hidden"></div>
  <div id="ustBant" class="absolute top-3 left-3 right-3 flex items-start justify-between gap-2 pointer-events-none z-10">
    <div id="ipucu" class="yuzer pointer-events-auto bg-white rounded-full px-4 py-2 text-[13px] font-medium text-slate-700 min-w-0 max-w-[60%] truncate">Yükleniyor…</div>
    <div class="flex flex-col gap-2 items-end pointer-events-auto">
      <div class="seg yuzer bg-white !p-1" style="width:150px"><button data-gor="2b" class="sec !h-9 !text-[13px]">Çizim</button><button data-gor="3b" class="!h-9 !text-[13px]">Gerçek</button></div>
      <button id="icGoster" class="yuzer bg-white rounded-full h-9 px-3 whitespace-nowrap text-[12px] font-semibold text-slate-700">Kapakları gizle</button>
    </div>
  </div>
  <div id="hataBant" class="hidden absolute bottom-3 left-3 right-3 z-10 bg-red-600 text-white rounded-2xl px-4 py-3 text-sm font-medium yuzer"></div>
</main>

<!-- Alt düğme şeridi -->
<nav id="dock" class="fixed bottom-0 inset-x-0 z-30 bg-white border-t" style="padding-bottom: env(safe-area-inset-bottom)">
  <div id="dockIc" class="flex gap-2 px-3 py-3 overflow-x-auto" style="height: var(--dock)"></div>
</nav>

<!-- Sağ panel (masaüstü): ölçü, düzenleme, renk, fiyat -->
<aside id="panel" class="fixed right-0 top-14 bottom-0 z-20 bg-white border-l flex-col" style="width:400px">
  <div class="flex-1 overflow-y-auto px-6 py-5 space-y-7">
    <section><div class="p-baslik">Düzenle</div><p id="pIpucu" class="text-sm text-slate-600 mb-3"></p><div id="pAraclar" class="p-arac"></div></section>
    <section id="pOlcuAlan"><div class="p-baslik">Ölçüler</div><div id="pOlcu" class="space-y-3"></div></section>
    <section id="pRenkAlan"><div class="p-baslik">Renk</div><div id="pRenk" class="space-y-4"></div></section>
  </div>
  <div class="border-t px-6 py-4 space-y-3">
    <div class="flex items-baseline justify-between"><span class="text-sm text-slate-500">Fiyat</span><span id="pFiyat" class="text-2xl font-extrabold text-slate-900">—</span></div>
    <div class="flex gap-2">
      <button id="pRender" class="h-12 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 font-semibold">📸 Render al</button>
      <button id="pSepet" class="flex-1 h-12 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold disabled:opacity-40">Sepete ekle</button>
    </div>
    <div class="text-[11px] text-slate-400">Kısayollar: Ctrl+Z geri · Ctrl+Y ileri · Delete sil · Esc bırak</div>
  </div>
</aside>

<!-- Alt sayfa -->
<div id="perde" class="fixed inset-0 bg-slate-900/40 z-40"></div>
<section id="sayfa" class="fixed bottom-0 inset-x-0 z-50 bg-white rounded-t-[28px] shadow-2xl max-h-[86dvh] flex flex-col" style="padding-bottom: env(safe-area-inset-bottom)">
  <div class="tutamak pt-2 pb-1 grid place-items-center"><div class="w-10 h-1.5 rounded-full bg-slate-200"></div></div>
  <div class="flex items-center justify-between px-5 pb-2"><h2 id="sayfaBaslik" class="text-[19px] font-bold"></h2>
    <button id="sayfaKapat" class="w-9 h-9 grid place-items-center rounded-full bg-slate-100" aria-label="Kapat">✕</button></div>
  <div id="sayfaIc" class="px-5 pb-3 overflow-y-auto space-y-5"></div>
  <div id="sayfaAlt" class="px-5 pt-2 pb-4 flex gap-3"></div>
</section>

<div id="tost" class="hidden fixed left-1/2 -translate-x-1/2 z-[60] bg-slate-900 text-white text-sm font-medium rounded-full px-5 py-3 yuzer" style="bottom: calc(var(--dock) + 16px + env(safe-area-inset-bottom))"></div>

<script>
const BASE = {{ taban|tojson }};
const BILGI = {{ bilgi|tojson }};
const IZIN = new Set({{ izinler|tojson }});
const SINIR = {{ sinir|tojson }};
const K = KabinCizim;
const GOR = {{ gorunum|tojson }};
const UST = /^(ust|üst)\b/i.test({{ t.sablon|tojson }});   // duvar (üst) dolabı: zeminde değil
const $ = id => document.getElementById(id);
const S = { v: null, goz: null, parca: null, onGizli: false, gorunum: '2b' };
let k3 = null;
const MASA = window.matchMedia('(min-width: 1024px)');
const masa = () => MASA.matches;
const dokun = m => masa() ? m.replace(/dokunun/g, 'tıklayın').replace(/Dokun/g, 'Tıkla') : m;

const IK = {   // ikonlar
  olcu: '<path d="M3 17l14-14 4 4L7 21H3z"/><path d="M14 6l2 2M11 9l2 2M8 12l2 2"/>',
  malzeme: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M10 4v16"/>',
  geri: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
  ileri: '<path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/>',
  raf: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16"/>',
  bolme: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 3v18"/>',
  kapak: '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="15.5" cy="12" r="1"/>',
  cekmece: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 6h4M10 12h4M10 18h4"/>',
  sil: '<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/>',
  duzenle: '<path d="M4 20h4l11-11-4-4L4 16z"/>',
  kapat: '<path d="M6 6l12 12M18 6L6 18"/>',
  kamera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
};
const ikon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IK[n]}</svg>`;
const sayi = n => (Math.round(n * 10) / 10).toLocaleString('tr-TR');
const tl = n => n.toLocaleString('tr-TR', {maximumFractionDigits: 0}) + ' ₺';

function tost(m, hata) {
  const t = $('tost'); t.textContent = m; t.classList.remove('hidden');
  t.classList.toggle('bg-red-600', !!hata); t.classList.toggle('bg-slate-900', !hata);
  clearTimeout(tost.z); tost.z = setTimeout(() => t.classList.add('hidden'), hata ? 4000 : 1800);
}

async function istek(yol, govde, yontem = 'POST') {
  const r = await fetch(BASE + yol, yontem === 'GET' ? {} : {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(govde || {})});
  let v; try { v = await r.json(); } catch (e) { v = {error: 'Sunucu cevap vermedi'}; }
  if (!r.ok) { tost(v.error || 'Hata', true); return null; }
  return v;
}
async function islem(isl, ops = {}) {
  const v = await istek('/islem', {islem: isl, ...ops});
  if (v && !ops.onizle) uygula(v);
  return v;
}

// ── çizim ──────────────────────────────────────────────────────────────
const ONLER = new Set(['kapak', 'cekmece']);
function gizliler() {
  return S.onGizli ? new Set(S.v.parcalar2b.filter(p => ONLER.has(p.tur)).map(p => p.id)) : new Set();
}
function ciz() {
  if (!S.v) return;
  // Çizim üstteki düğmelerin altından başlar (dolabın üstü düğmelerin arkasında kalmasın)
  const ub = $('ustBant'), ust = ub.offsetTop + ub.offsetHeight + 6;
  $('s2').style.top = ust + 'px'; $('s2').style.height = `calc(100% - ${ust}px)`;
  const hat = new Set(); for (const b of S.v.doktor) if (b.seviye === 'hata') for (const p of b.parcalar) { hat.add(p); if (p.split('.')[1]) hat.add(p.split('.')[1]); }
  K.ciz2B($('s2'), S.v, {seciliGoz: S.goz ? [S.goz] : [], seciliParca: new Set(S.parca ? [S.parca] : []), hatali: hat,
                        kapakSec: true, gizli: gizliler(), etiket: true, detay: false});
  if (k3) k3.guncelle(S.v, {seciliParca: new Set(S.parca ? [S.parca] : []), hatali: hat, gizli: gizliler(), gorunum: GOR, ust: UST,
                           seciliGoz: S.goz ? S.goz.i : null});
}
function uygula(v) {
  S.v = v;
  if (S.parca && !v.parcalar2b.some(p => p.id === S.parca)) S.parca = null;
  if (S.goz) {                 // aynı yerdeki gözü koru (işlemden sonra gözler değişir)
    const i = v.gozler.findIndex(z => S.goz.x >= z.x1 && S.goz.x <= z.x2 && S.goz.y >= z.y1 && S.goz.y <= z.y2);
    S.goz = i >= 0 ? gozNesne(i) : null;
  }
  const f = v.fiyat && v.fiyat.toplam;
  $('fiyat').textContent = f ? tl(f) : ''; $('fiyat').classList.toggle('hidden', !f);
  $('sepetBtn').disabled = v.hata_var; $('pSepet').disabled = v.hata_var;
  $('pFiyat').textContent = f ? tl(f) : '—';
  panelOlcuGuncelle(); panelRenkCiz();
  const h = v.doktor.find(b => b.seviye === 'hata');
  $('hataBant').textContent = h ? '⚠ ' + h.mesaj : ''; $('hataBant').classList.toggle('hidden', !h);
  ciz(); dock(); ipucu();
}
function gozNesne(i) { const z = S.v.gozler[i]; return {i, x: (z.x1 + z.x2) / 2, y: (z.y1 + z.y2) / 2, z}; }

function ipucu() {
  const p = S.parca && S.v.parcalar2b.find(x => x.id === S.parca);
  let m;
  if (p) m = `${p.ad} · ${sayi(p.kutu.y2 - p.kutu.y1)} × ${sayi(p.kutu.x2 - p.kutu.x1)} mm`;
  else if (S.goz) m = `Bölme seçildi · ${sayi(S.goz.z.x2 - S.goz.z.x1)} × ${sayi(S.goz.z.y2 - S.goz.z.y1)} mm`;
  else m = S.v.parcalar2b.length > 4 ? 'Değiştirmek için bir bölmeye ya da parçaya dokunun' : 'Raf, kapak eklemek için bir bölmeye dokunun';
  $('ipucu').textContent = dokun(m); $('pIpucu').textContent = dokun(m);
}

// ── alt şerit ──────────────────────────────────────────────────────────
function dbtn(k, ad, ik, sinif = '', dis = false) { return `<button class="dock-btn ${sinif}" data-k="${k}" ${dis ? 'disabled' : ''}>${ikon(ik)}<span>${ad}</span></button>`; }
function dock() {
  let h = '';
  const p = S.parca && S.v.parcalar2b.find(x => x.id === S.parca);
  if (p) {
    if (ONLER.has(p.tur) && IZIN.has('ekle.' + p.tur)) h += dbtn('duzenle', 'Düzenle', 'duzenle', 'ana');
    if (komsular(S.v, p)) h += dbtn('konum', 'Konum', 'olcu', 'ana');
    if (p.tur !== 'govde' && p.tur !== 'arkalik' && IZIN.has('duzenle.sil')) h += dbtn('sil', 'Sil', 'sil', 'tehlike');
    h += dbtn('bırak', 'Kapat', 'kapat');
  } else if (S.goz) {
    if (IZIN.has('ekle.raf')) h += dbtn('raf', 'Raf', 'raf');
    if (IZIN.has('ekle.dikeybolme') || IZIN.has('ekle.yataybolme')) h += dbtn('bolme', 'Bölme', 'bolme');
    if (IZIN.has('ekle.kapak')) h += dbtn('kapak', 'Kapak', 'kapak', 'ana');
    if (IZIN.has('ekle.cekmece')) h += dbtn('cekmece', 'Çekmece', 'cekmece');
    h += dbtn('bırak', 'Kapat', 'kapat');
  } else {
    const d = S.v.durum || {};
    h += dbtn('olcu', 'Ölçü', 'olcu', 'ana');
    if ((IZIN.has('govde.malzeme') || IZIN.has('parca.malzeme')) && panelMalzemeleri().length > 1) h += dbtn('malzeme', 'Renk', 'malzeme');
    h += dbtn('geri', 'Geri al', 'geri', '', !d.geri) + dbtn('ileri', 'İleri al', 'ileri', '', !d.ileri);
    h += dbtn('render', 'Render', 'kamera');
  }
  $('dockIc').innerHTML = h;
  // masaüstü panel: ölçü ve renk zaten açık; seçim yokken geri / ileri
  const d = S.v.durum || {};
  $('pAraclar').innerHTML = (p || S.goz) ? h.replace('<span>Kapat</span>', '<span>Bırak</span>')
    : dbtn('geri', 'Geri al', 'geri', '', !d.geri) + dbtn('ileri', 'İleri al', 'ileri', '', !d.ileri) + dbtn('gizle', S.onGizli ? 'Kapakları göster' : 'Kapakları gizle', 'kapak');
}
async function aracTik(e) {
  const b = e.target.closest('[data-k]'); if (!b || b.disabled) return;
  const k = b.dataset.k;
  if (k === 'render') return renderSayfa();
  if (k === 'gizle') return $('icGoster').click();
  if (k === 'bırak') { S.goz = null; S.parca = null; ciz(); dock(); ipucu(); }
  else if (k === 'geri' || k === 'ileri') { const v = await istek('/' + k, {}); if (v) { uygula(v); tost(k === 'geri' ? 'Geri alındı' : 'İleri alındı'); } }
  else if (k === 'sil') { const id = S.parca; S.parca = null; if (await islem({tip: 'sil', id})) tost('Silindi'); }
  else if (k === 'konum') konumSayfa(S.v.parcalar2b.find(x => x.id === S.parca));
  else if (k === 'duzenle') { const p = S.v.parcalar2b.find(x => x.id === S.parca); p.tur === 'kapak' ? kapakSayfa(p) : cekmeceSayfa(p); }
  else ({olcu: olcuSayfa, malzeme: malzemeSayfa, raf: rafSayfa, bolme: bolmeSayfa, kapak: () => kapakSayfa(), cekmece: () => cekmeceSayfa()})[k]();
}
$('dockIc').addEventListener('click', aracTik);
$('pAraclar').addEventListener('click', aracTik);

function yakinParca(e) {
  const svg = $('s2'), m = svg.getScreenCTM(); if (!m) return null;
  const nk = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
  const tol = 14 / m.a;                       // ekranda ~14 px
  let en = null, ed = tol;

}

function kulpSablonu() { return (BILGI.eleman_sablonlari.kulp || []).find(a => a !== 'Kulpsuz') || null; }
// Kulp: motor konumu 3×3 ızgaradır ve menteşeye göre yansıtılır ("sag" = açılan kenar). Müşteri kapağın
// resmi üzerinde açılan kenarda ya da ortada, üstte / ortada / altta seçer; sağa açılan kapakta resim aynalanır.
const KULP_YERLER = [['ortaust', 50, 13], ['orta', 50, 50], ['ortaalt', 50, 87], ['sagust', 82, 13], ['sagorta', 82, 50], ['sagalt', 82, 87]];
const ayna = k => k.replace('sag', '\0').replace('sol', 'sag').replace('\0', 'sol');
function kulpSecici(kapakMi, yon, yer) {
  const yonlar = [['yok', 'Kulpsuz'], ['YATAY', 'Yatay'], ...(kapakMi ? [['DIKEY', 'Dikey']] : [])];
  if (!kulpSablonu()) return `<input type="hidden" name="kulpyon" value="yok">`;
  if (!kapakMi) return `<div><div class="etiket">Kulp</div>${seg('kulpyon', yonlar, yon)}</div>
    <div data-kulp-yer class="${yon === 'yok' ? 'hidden' : ''}"><div class="etiket">Kulp yeri</div>${seg('kulpyer', [['ortaust', 'Üstte'], ['orta', 'Ortada']], yer === 'orta' ? 'orta' : 'ortaust')}</div>`;
  return `<div><div class="etiket">Kulp</div>${seg('kulpyon', yonlar, yon)}</div>
    <div data-kulp-yer class="${yon === 'yok' ? 'hidden' : ''}"><div class="etiket">Kulp yeri <span class="font-normal text-slate-400">kapağın üzerinde seçin</span></div>
      <div class="flex items-center gap-4">
        <div class="kulp-kapak ${yon === 'DIKEY' ? 'dikey' : 'yatay'}">
          <span class="mentese" style="top:18%"></span><span class="mentese" style="top:78%"></span>
          ${KULP_YERLER.map(([k, x, y]) => `<button type="button" data-kulpyer="${k}" class="${k === yer ? 'sec' : ''}" style="left:${x}%;top:${y}%" aria-label="${k}"><i></i></button>`).join('')}
        </div>
        <p class="text-xs text-slate-500">○ menteşe tarafı. Kulp açılan kenara göre yerleşir; iki kapakta kulplar ortada buluşur.</p>
      </div><input type="hidden" name="kulpyer" value="${yer}"></div>`;
}
function kulpGuncelle(f, aynaMi) {         // seçicinin görünümü (yön değişince çubuk, açılış değişince ayna)
  const alan = $('sayfaIc').querySelector('[data-kulp-yer]'); if (!alan) return;
  alan.classList.toggle('hidden', f.kulpyon === 'yok');
  const kk = alan.querySelector('.kulp-kapak');
  if (kk) { kk.classList.toggle('dikey', f.kulpyon === 'DIKEY'); kk.classList.toggle('yatay', f.kulpyon !== 'DIKEY'); kk.classList.toggle('ayna', !!aynaMi); }
}
function kulpNesne(f) {
  const ku = kulpSablonu();
  if (!ku || f.kulpyon === 'yok') return {konum: 'yok'};
  const dik = f.kulpyon === 'DIKEY';
  return {sablon: ku, konum: f.kulpyer || 'ortaust', yon: dik ? 'DIKEY' : 'YATAY', yatay_mesafe: dik ? 40 : 100, dikey_mesafe: dik ? 110 : 40};
}
function mevcutKulp(p, kapakMi) {          // düzenlenen parçanın kulbu → seçici başlangıcı (göreli)
  if (!p) return null;
  if (!(p.kulp || []).length) return {yon: 'yok', yer: kapakMi ? 'ortaust' : 'ortaust'};
  const yer = p.menteseyeri === 'SAG' ? ayna(p.kulp[0]) : p.kulp[0];
  return {yon: (p.kulp_yon || [])[0] || 'YATAY', yer: KULP_YERLER.some(([k]) => k === yer) ? yer : 'ortaust'};
}

function onuKapali(z) {            // bu bölmenin önünde kapak / çekmece var mı
  const cx = (z.x1 + z.x2) / 2, cy = (z.y1 + z.y2) / 2;
  return S.v.parcalar2b.some(p => ONLER.has(p.tur) && cx > p.kutu.x1 && cx < p.kutu.x2 && cy > p.kutu.y1 && cy < p.kutu.y2);
}
function kapsamGozleri(kapsam) {  // kapak yalnız önü boş bölmelere (çekmecenin üstüne binmesin)
  const z0 = S.goz.z;
  if (kapsam === 'sutun') return S.v.gozler.filter(z => Math.abs(z.x1 - z0.x1) < 1 && Math.abs(z.x2 - z0.x2) < 1 && !onuKapali(z));
  if (kapsam === 'dolap') return S.v.gozler.filter(z => !onuKapali(z));
  return [z0];
}
function kapsamNoktalari(kapsam) { return kapsamGozleri(kapsam).map(z => [(z.x1 + z.x2) / 2, (z.y1 + z.y2) / 2]); }

function kapakSayfa(p) {          // p: düzenlenen kapak (grup)
  if (!p && gozYok()) return;
  const grup = p ? S.v.parcalar2b.filter(x => x.tur === 'kapak' && (p.grup ? x.grup === p.grup : x.id === p.id)) : [];
  const n0 = grup.length || ((S.goz && S.goz.z.x2 - S.goz.z.x1 > 600) ? 2 : 1);
  const uzun = S.goz && (S.goz.z.y2 - S.goz.z.y1) > 1000;
  const k0 = mevcutKulp(p, true) || (uzun ? {yon: 'DIKEY', yer: 'sagorta'} : {yon: 'YATAY', yer: 'ortaust'});
  const sutunVar = !p && kapsamGozleri('sutun').length > 1;
  const dolapVar = !p && kapsamGozleri('dolap').length > kapsamGozleri('sutun').length;
  let ic = `<div><div class="etiket">Kapak sayısı</div>${seg('n', [[1, '1'], [2, '2'], [3, '3'], [4, '4']], n0)}</div>`;
  if (!p) ic += `<div><div class="etiket">Neyi kapatsın?</div>${seg('kapsam', [['goz', 'Bu bölmeyi'], ...(sutunVar ? [['sutun', 'Bütün sütunu']] : []), ...(dolapVar ? [['dolap', 'Bütün dolabı']] : [])], sutunVar ? 'sutun' : 'goz')}</div>`;
  ic += `<div id="acilisAlan" class="${n0 === 1 ? '' : 'hidden'}"><div class="etiket">Açılış yönü</div>${seg('acilis', [['SOL', 'Sola açılır'], ['SAG', 'Sağa açılır']], p ? (p.menteseyeri === 'SAG' ? 'SAG' : 'SOL') : 'SOL')}</div>
    ${kulpSecici(true, k0.yon, k0.yer)}
    <div id="onBilgi" class="text-sm text-slate-500 min-h-[20px]"></div>`;
  sayfaAc(p ? 'Kapağı düzenle' : 'Kapak ekle', ic, birincil(p ? 'Kaydet' : 'Kapak ekle'));
  const topla = () => {
    const f = deger(), n = +f.n;
    $('acilisAlan').classList.toggle('hidden', n !== 1);
    kulpGuncelle(f, n === 1 && f.acilis === 'SAG');
    const base = {adet: n, kulp: kulpNesne(f), ...(n === 1 ? {menteseler: [f.acilis]} : {})};
    return p ? {tip: 'grup_duzenle', id: p.id, ...base} : {tip: 'ekle', tur: 'kapak', ...base, noktalar: kapsamNoktalari(f.kapsam)};
  };
  let z = null;
  const onizle = () => { clearTimeout(z); z = setTimeout(async () => {
    const v = await istek('/islem', {islem: topla(), onizle: true});
    if (!$('onBilgi')) return;
    if (!v) { $('onBilgi').textContent = ''; $('uygula').disabled = true; return; }
    $('uygula').disabled = false;
    const yeni = new Set(v.sonuc.yeni || []);
    $('onBilgi').innerHTML = v.parcalar2b.filter(x => yeni.has(x.id)).map((x, i) =>
      `${i + 1}. kapak: <b>${sayi(x.kutu.y2 - x.kutu.y1)} × ${sayi(x.kutu.x2 - x.kutu.x1)} mm</b> · ${x.mentese} menteşe`).join('<br>');
  }, 250); };
  $('sayfaIc').onchange = onizle; $('sayfaIc').oninput = onizle; onizle();
  $('uygula').onclick = async () => { const v = await islem(onEki(topla())); if (v) { tost(p ? 'Kapak güncellendi' : 'Kapak eklendi'); S.goz = null; S.parca = null; dock(); ipucu(); sayfaKapat(); } };
}

async function cekmeceSayfa(p) {
  if (!p && gozYok()) return;
  const n0 = p ? (p.grup ? S.v.parcalar2b.filter(x => x.grup === p.grup).length : 1) : 3;
  const sab = (BILGI.eleman_sablonlari.cekmece || [])[0];
  // ray: bu dolaba sığan ilk (müşteriye açık) ray otomatik
  const r = await istek('/islem', {islem: {tip: 'ray_kontrol', sablon: sab}, onizle: true});
  const ray = r && BILGI.raylar.find(x => r.sonuc.raylar[x.kod]);
  if (!ray) { tost('Bu derinliğe uygun çekmece rayı yok', true); return; }
  sayfaAc(p ? 'Çekmeceleri düzenle' : 'Çekmece ekle', `<div><div class="etiket">Kaç çekmece?</div>${adim('n', n0, 1, 6)}</div>
    ${(k => kulpSecici(false, k.yon, k.yer))(mevcutKulp(p, false) || {yon: 'YATAY', yer: 'ortaust'})}
    <div class="text-sm text-slate-500">Ray: <b>${K.esc(ray.ad)}</b> (derinliğe göre otomatik)</div>
    <div id="onBilgi" class="text-sm text-slate-500 min-h-[20px]"></div>`, birincil(p ? 'Kaydet' : 'Çekmece ekle'));
  const topla = () => {
    const f = deger(); kulpGuncelle(f, false);
    const base = {sablon: sab, adet: f.n, secenek: {raytipi: ray.kod}, kulp: kulpNesne(f)};
    return p ? {tip: 'grup_duzenle', id: p.id, ...base} : {tip: 'ekle', tur: 'cekmece', ...base, noktalar: [[S.goz.x, S.goz.y]]};
  };
  let z = null;
  const onizle = () => { clearTimeout(z); z = setTimeout(async () => {
    const v = await istek('/islem', {islem: topla(), onizle: true});
    if (!$('onBilgi')) return;
    if (!v) { $('uygula').disabled = true; $('onBilgi').textContent = ''; return; }
    $('uygula').disabled = false;
    const yeni = new Set(v.sonuc.yeni || []), ps = v.parcalar2b.filter(x => yeni.has(x.id));
    $('onBilgi').innerHTML = ps.length ? `Çekmece önü: <b>${sayi(ps[0].kutu.y2 - ps[0].kutu.y1)} × ${sayi(ps[0].kutu.x2 - ps[0].kutu.x1)} mm</b>` : '';
  }, 250); };
  $('sayfaIc').onchange = onizle; $('sayfaIc').oninput = onizle; onizle();
  $('uygula').onclick = async () => { const v = await islem(onEki(topla())); if (v) { tost(p ? 'Çekmeceler güncellendi' : 'Çekmece eklendi'); S.goz = null; S.parca = null; dock(); ipucu(); sayfaKapat(); } };
}

// ── raf / bölme konumu: komşu gözün ölçüsü verilir (motor taşır ve o gözü kilitler) ──
const YATAY = new Set(['raf', 'yataybolme', 'yataykayit']), DIKEY = new Set(['dikeybolme', 'dikeykayit']);
function komsular(v, p) {
  if (!p || !(YATAY.has(p.tur) || DIKEY.has(p.tur))) return null;
  const k = p.kutu, yatay = YATAY.has(p.tur), cx = (k.x1 + k.x2) / 2, cy = (k.y1 + k.y2) / 2;
  const bul = f => v.gozler.filter(f).sort((a, b) => yatay ? Math.abs((a.x1 + a.x2) / 2 - cx) - Math.abs((b.x1 + b.x2) / 2 - cx)
                                                         : Math.abs((a.y1 + a.y2) / 2 - cy) - Math.abs((b.y1 + b.y2) / 2 - cy))[0] || null;
  const a = yatay ? bul(z => Math.abs(z.y1 - k.y2) < 1.5 && z.x1 < k.x2 && z.x2 > k.x1)    // altı
                  : bul(z => Math.abs(z.x2 - k.x1) < 1.5 && z.y1 < k.y2 && z.y2 > k.y1);   // solu
  const b = yatay ? bul(z => Math.abs(z.y2 - k.y1) < 1.5 && z.x1 < k.x2 && z.x2 > k.x1)    // üstü
                  : bul(z => Math.abs(z.x1 - k.x2) < 1.5 && z.y1 < k.y2 && z.y2 > k.y1);   // sağı
  if (!a && !b) return null;
  const olc = z => z && Math.round((yatay ? z.y2 - z.y1 : z.x2 - z.x1) * 10) / 10;
  const nok = z => z && [(z.x1 + z.x2) / 2, (z.y1 + z.y2) / 2];
  return {yatay, a: olc(a), b: olc(b), na: nok(a), nb: nok(b)};
}
async function konumSayfa(p) {
  const n = komsular(S.v, p); if (!n) return;
  const [ea, eb] = n.yatay ? ['Altındaki boşluk (mm)', 'Üstündeki boşluk (mm)'] : ['Solundaki boşluk (mm)', 'Sağındaki boşluk (mm)'];
  const toplam = (n.a || 0) + (n.b || 0) + (n.yatay ? p.kutu.y2 - p.kutu.y1 : p.kutu.x2 - p.kutu.x1);
  let ic = '';
  if (n.a != null) ic += `<div><div class="etiket">${ea}</div>${adim('a', n.a, 10, Math.round(toplam), 10)}</div>`;
  if (n.b != null) ic += `<div><div class="etiket">${eb}</div>${adim('b', n.b, 10, Math.round(toplam), 10)}</div>`;
  ic += `<p class="text-sm text-slate-500">${K.esc(p.ad)} bu ölçüye göre ${n.yatay ? 'yukarı / aşağı' : 'sağa / sola'} kayar. Değiştirdiğiniz boşluk sabitlenir (🔒).</p>`;
  await istek('/panel/ac', {});
  sayfaAc(n.yatay ? 'Yükseklik' : 'Konum', ic, ikincil('Vazgeç', 'vazgec') + birincil('Tamam'), async neden => {
    const v = await istek('/panel/' + (neden === 'iptal' ? 'iptal' : 'tamam'), {}); if (v) uygula(v);
  });
  let z = null, son = null;
  const canli = e => { const ad = e.target.name; if (!ad) return; son = ad; clearTimeout(z); z = setTimeout(async () => {
    const f = deger(), nokta = son === 'a' ? n.na : n.nb, d = f[son];
    if (!(d >= 10)) return;
    const v = await islem({tip: 'goz_olcu', nokta, yon: n.yatay ? 'y' : 'x', deger: d}, {panel: true});
    if (!v) return;
    if (v.sonuc && v.sonuc.mesaj) tost(v.sonuc.mesaj, true);
    const p2 = v.parcalar2b.find(x => x.id === p.id), m = p2 && komsular(v, p2);      // öbür alanı güncelle
    const diger = son === 'a' ? 'b' : 'a', i = $('sayfaIc').querySelector(`[name=${diger}]`);
    if (m && i && m[diger] != null) i.value = String(m[diger]).replace('.', ',');
  }, 300); };
  $('sayfaIc').oninput = canli;
  $('uygula').onclick = () => sayfaKapat('tamam');
  $('vazgec').onclick = () => sayfaKapat('iptal');
}

// ── sepet ──────────────────────────────────────────────────────────────
$('sepetBtn').addEventListener('click', () => {
  if (S.v.hata_var) return tost('Dolapta hata var, önce düzeltin', true);
  sayfaAc('Sepete ekle', `<div><div class="etiket">Bu dolaptan kaç adet?</div>${adim('adet', S.v.ozellik.adet || 1, 1, 999)}</div>
    ${S.v.fiyat && S.v.fiyat.toplam ? `<div class="text-sm text-slate-500">Dolap fiyatı: <b class="text-emerald-700">${tl(S.v.fiyat.toplam)}</b></div>` : ''}`, birincil('Sepete ekle'));
  $('uygula').onclick = async () => {
    const r = await fetch('/kabin/t/{{ t.id }}/sepet', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({adet: deger().adet})});
    const v = await r.json();
    if (!r.ok) return tost(v.error, true);
    const g = await istek('/veri', null, 'GET'); if (g) uygula(g);
    sayfaAc('Sepete eklendi ✓', '<p class="text-slate-600">Dolabınız sepette. Siparişi sepetten verebilir ya da tasarıma devam edebilirsiniz.</p>',
            ikincil('Devam et', 'devam') + birincil('Sepete git', 'git'));
    $('devam').onclick = () => sayfaKapat(); $('git').onclick = () => { location.href = '/magaza/sepet'; };
  };
});

// ── başlat ─────────────────────────────────────────────────────────────
(async () => {
  const v = await istek('/veri', null, 'GET');
  if (!v) return;
  uygula(v);
  if (!(v.durum || {}).geri && v.parcalar2b.length <= 6) {      // yeni dolap: önce ölçü
    $('ipucu').textContent = 'Önce dolabın ölçüsünü verin';
    if (masa()) { $('pIpucu').textContent = 'Önce sağdaki ölçüleri girin, sonra dolapta bir bölmeye tıklayın.'; $('pOlcuAlan').classList.add('vurgu'); }
    else setTimeout(olcuSayfa, 350);
  }
})();
</script>

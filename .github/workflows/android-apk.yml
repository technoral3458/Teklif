name: Parametrik Kesim APK

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: APK derle ve yayımla
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK paketleri
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Birim testleri
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

      - name: APK derle
        env:
          PK_VERSION_CODE: ${{ github.run_number }}
          PK_VERSION_NAME: 1.${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: APK'yı adlandır
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          DEST="ParametrikKesim-1.${{ github.run_number }}.apk"
          cp "$SRC" "$DEST"
          echo "path=android/$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: APK'yı iş akışı çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ParametrikKesim-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporlari
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: GitHub sürümü yayımla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="parametrik-apk-v1.${{ github.run_number }}"
          gh release create "$TAG" "${{ steps.apk.outputs.name }}" \
            --title "Parametrik Kesim 1.${{ github.run_number }}" \
            --notes "Parametrik Kesim mobil istemcisi (hata ayıklama derlemesi).

          **Kurulum:** Telefonunuzdan bu sayfayı açın, APK dosyasına dokunun ve kuruluma izin verin.
          (Ayarlar > Güvenlik > Bilinmeyen kaynaklardan kuruluma izin verilmesi gerekir.)

          **İlk açılış:** Ayarlar ekranına sunucu adresinizi girin (ör. https://panel.firma.com),
          bağlantıyı test edip kaydedin, ardından e-posta ve şifrenizle giriş yapın.

          Not: iş listesi için sunucuda /parametric/api/jobs ve /parametric/api/jobs/{id}
          JSON uç noktaları gerekiyor (ayrıntı: android/README.md)." \
            --target "${{ github.sha }}"

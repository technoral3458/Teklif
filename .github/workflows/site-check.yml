name: Site ve SSL kontrolü

# titaniumcam.com'un HTTP/HTTPS durumunu ve SSL sertifikasını kontrol eder.
# Hiçbir şey yüklemez veya değiştirmez; yalnızca okur.

on:
  push:
    branches:
      - main
      - master
      - claude/titanium-cam-website-f1ij41
    paths:
      - ".github/workflows/site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Siteyi kontrol et
    runs-on: ubuntu-latest
    env:
      HOSTS: titaniumcam.com www.titaniumcam.com
    steps:
      - name: DNS
        run: |
          for h in $HOSTS ftp.titaniumcam.com; do echo "$h → $(getent hosts "$h" | awk '{print $1}' | tr '\n' ' ')"; done
          echo "Ad sunucuları: $(dig +short NS titaniumcam.com | tr '\n' ' ')"
          echo "A kaydı (1.1.1.1): $(dig +short A titaniumcam.com @1.1.1.1 | tr '\n' ' ')"
          echo "A kaydı (8.8.8.8): $(dig +short A titaniumcam.com @8.8.8.8 | tr '\n' ' ')"

      - name: HTTP / HTTPS yanıtları
        run: |
          for h in $HOSTS; do
            for scheme in http https; do
              out=$(curl -sS -o /dev/null -w '%{http_code} → %{url_effective}' -L --max-time 30 "$scheme://$h/" 2>&1 || true)
              echo "$scheme://$h/  :  $out"
            done
          done

      - name: cPanel sunucusu (93.89.225.78) üzerinden doğrudan deneme
        run: |
          for h in $HOSTS; do
            for scheme in http https; do
              port=$([ $scheme = https ] && echo 443 || echo 80)
              out=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 30 --resolve "$h:$port:93.89.225.78" "$scheme://$h/ozellikler" 2>&1 || true)
              title=$(grep -o '<title>[^<]*' /tmp/body 2>/dev/null | head -1 | sed 's/<title>//')
              echo "$scheme://$h/ozellikler @93.89.225.78  :  $out  ${title:+[başlık: $title]}"
            done
          done
          echo "== Sertifika (93.89.225.78)"
          echo | timeout 20 openssl s_client -connect 93.89.225.78:443 -servername titaniumcam.com 2>/dev/null \
            | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "sertifika alınamadı"

      - name: SSL sertifikası
        run: |
          for h in $HOSTS; do
            echo "== $h:443"
            echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" -verify_return_error 2>/tmp/err \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null \
              || echo "sertifika alınamadı"
            grep -iE 'verify|error' /tmp/err | head -3 || true
          done

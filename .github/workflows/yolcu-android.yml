name: Yolcu Android APK

on:
  push:
    paths:
      - "yolcu-android/**"
      - ".github/workflows/yolcu-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yolcu-android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "Yolcu-v1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Yolcu-v1.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Yolcu-apk
          path: |
            yolcu-android/Yolcu-*.apk
            yolcu-android/Yolcu-*.aab

      - name: Sürüm (Release) olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yolcu-v1.0.${{ github.run_number }}
          name: Yolcu v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            yolcu-android/Yolcu-v1.0.${{ github.run_number }}.apk
            yolcu-android/Yolcu-v1.0.${{ github.run_number }}.aab
          body: |
            Avrupa için Türkçe navigasyon: sınır kapıları, km sayacı, Android Auto.
            Telefonda bu sayfayı açıp aşağıdaki .apk dosyasını indirin ve kurun.
            Kurulum adımları: yolcu-android/README.md

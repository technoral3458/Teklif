name: Web sitesini cPanel'e yükle

# website/ klasöründe değişiklik gönderildiğinde siteyi FTP ile cPanel'e yükler.
# GitHub mobil uygulamasından elle de çalıştırılabilir: Actions → bu iş akışı → Run workflow.
#
# GitHub'da tanımlanması gerekenler (Settings → Secrets and variables → Actions):
#   Secrets   : FTP_PASSWORD   (cPanel FTP şifresi — asla koda yazmayın)  ← tek zorunlu ayar
#   İsteğe bağlı variables (boşsa aşağıdaki varsayılanlar kullanılır):
#               FTP_SERVER     varsayılan: ftp.titaniumcam.com
#               FTP_USERNAME   varsayılan: skttitan
#               FTP_PORT       varsayılan: 21
#               SITE_URL       varsayılan: titaniumcam.com (https, olmazsa http denenir)
#
# Bağlantı her zaman şifreli (FTPS) ve sertifika doğrulamalıdır. Sertifika alan adına
# değil de hosting sunucusunun adına düzenlenmişse o ad otomatik bulunup kullanılır.
# FTP girişinin ev klasörüne mi yoksa doğrudan public_html'e mi açıldığı da algılanır.

on:
  push:
    branches:
      - main
      - master
      - claude/titanium-cam-website-f1ij41
    paths:
      - "website/**"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Kontrol et ve yükle
    runs-on: ubuntu-latest
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: PHP söz dizimi kontrolü
        run: |
          set -e
          find website -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Tüm PHP dosyaları geçerli."

      - name: Ayarları kontrol et
        id: cfg
        env:
          HAS_PASSWORD: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          if [ "$HAS_PASSWORD" != "true" ]; then
            echo "::warning::FTP_PASSWORD secret'ı tanımlı değil, yükleme atlandı. Settings → Secrets and variables → Actions → New repository secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: FTP bağlantısını test et ve klasör yapısını algıla
        id: ftp
        if: steps.cfg.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || 'ftp.titaniumcam.com' }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || 'skttitan' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp > /dev/null

          try_login() {  # $1 = sunucu adı; sertifika doğrulaması açık
            timeout 60 lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; set net:max-retries 1; set net:timeout 20; open --env-password -u \"$FTP_USERNAME\" -p $FTP_PORT $1; cls -1" 2>err.txt
          }

          server="$FTP_SERVER"
          if ! listing=$(try_login "$server"); then
            echo "Bağlantı $server ile olmadı: $(tr '\n' ' ' < err.txt)"
            # Sertifikadaki asıl sunucu adını bul (paylaşımlı hostinglerde yaygın).
            cert_name=$(echo | timeout 20 openssl s_client -connect "$FTP_SERVER:$FTP_PORT" -starttls ftp 2>/dev/null \
              | openssl x509 -noout -subject 2>/dev/null | sed -n 's/.*CN *= *\([^,/]*\).*/\1/p' | tr -d ' ')
            if [ -n "$cert_name" ] && [ "$cert_name" != "$FTP_SERVER" ] && [ "${cert_name#\*}" = "$cert_name" ]; then
              echo "Sunucu sertifikası '$cert_name' adına düzenlenmiş; bu adla deneniyor."
              server="$cert_name"
              listing=$(try_login "$server") || server=""
            else
              server=""
            fi
          fi

          if [ -z "$server" ]; then
            echo "::error::FTP'ye güvenli bağlantı kurulamadı. Son hata: $(tr '\n' ' ' < err.txt) — Şifreyi (FTP_PASSWORD) ve kullanıcı adını ($FTP_USERNAME) kontrol edin."
            exit 1
          fi

          echo "Bağlantı başarılı: $server"
          echo "FTP kökündeki öğeler:"; echo "$listing" | sed 's/^/  /'
          echo "server=$server" >> "$GITHUB_OUTPUT"
          if echo "$listing" | grep -qE '^public_html/?$'; then
            echo "Giriş ev klasörüne açılıyor → site public_html/ içine, kod ve kayıtlar yanına yüklenecek."
            echo "layout=home" >> "$GITHUB_OUTPUT"
          else
            echo "Giriş doğrudan web klasörüne açılıyor → dosyalar buraya yüklenecek (app/ ve storage/ .htaccess ile korunur)."
            echo "layout=webroot" >> "$GITHUB_OUTPUT"
          fi

      - name: Yükleme klasörünü hazırla
        if: steps.cfg.outputs.ready == 'true'
        env:
          LAYOUT: ${{ steps.ftp.outputs.layout }}
        run: |
          set -e
          if [ "$LAYOUT" = "home" ]; then
            web=deploy/public_html   # /home/kullanici/{public_html,app,storage}
          else
            web=deploy               # public_html/{index.php,app,storage}
          fi
          mkdir -p "$web" deploy/storage
          cp -a website/public/. "$web"/
          cp -a website/app deploy/app
          cp website/storage/.htaccess deploy/storage/.htaccess
          find deploy -type f | sort

      - name: FTP ile yükle
        if: steps.cfg.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.server }}
          username: ${{ vars.FTP_USERNAME || 'skttitan' }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: strict
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          # Yalnızca değişen dosyalar yüklenir; sunucudaki form kayıtlarına dokunulmaz.
          exclude: |
            **/.git*
            **/.git*/**
            storage/*.jsonl
          state-name: .titaniumcam-deploy-state.json
          log-level: standard
          timeout: 120000

      - name: Siteyi kontrol et
        if: steps.cfg.outputs.ready == 'true'
        env:
          SITE: ${{ vars.SITE_URL || 'titaniumcam.com' }}
        run: |
          host=${SITE#*://}; host=${host%/}
          for scheme in https http; do
            url="$scheme://$host"
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$url/ozellikler" || true)
            echo "$url/ozellikler → $code"
            if [ "$code" = "200" ]; then
              echo "### Site yayında: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::Dosyalar yüklendi ancak site henüz açılmıyor. Alan adı yeni alındıysa DNS yayılması birkaç saat sürebilir; panelde PHP sürümünün 8.1+ olduğunu da kontrol edin."

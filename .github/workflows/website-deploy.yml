name: Web sitesini cPanel'e yükle

# website/ klasöründe değişiklik gönderildiğinde siteyi FTP ile cPanel'e yükler.
# GitHub mobil uygulamasından elle de çalıştırılabilir: Actions → bu iş akışı → Run workflow.
#
# GitHub'da tanımlanması gerekenler (Settings → Secrets and variables → Actions):
#   Secrets   : FTP_PASSWORD   (cPanel FTP şifresi — asla koda yazmayın)  ← tek zorunlu ayar
#   İsteğe bağlı variables (boşsa aşağıdaki varsayılanlar kullanılır):
#               FTP_SERVER     varsayılan: ftp.titaniumcam.com
#               FTP_USERNAME   varsayılan: skttitan
#               FTP_PORT       varsayılan: 21
#               SITE_URL       varsayılan: titaniumcam.com (https, olmazsa http denenir)
#
#               FTP_CERT_FINGERPRINT  sunucu sertifikasının SHA1 parmak izi (aşağıdaki varsayılan)
#
# Bağlantı her zaman şifreli (FTPS) kurulur. Hosting sunucusunun sertifikası güvenilir bir
# kuruluşça imzalanmadığı için sertifika SABİTLENİR: yalnızca parmak izi FTP_CERT_FINGERPRINT
# ile aynı olan sertifikaya güvenilir, başka her sertifikada bağlantı reddedilir.
# Hosting firması sertifikayı yenilerse iş akışı yeni parmak izini kayda yazar ve durur;
# hosting firmasıyla doğrulayıp FTP_CERT_FINGERPRINT değişkenini güncelleyin.
#
# FTP girişinin ev klasörüne mi yoksa doğrudan public_html'e mi açıldığı otomatik algılanır.

on:
  push:
    branches:
      - main
      - master
      - claude/titanium-cam-website-f1ij41
    paths:
      - "website/**"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:

concurrency:
  group: website-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Kontrol et ve yükle
    runs-on: ubuntu-latest
    steps:
      - name: Kaynağı al
        uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"

      - name: PHP söz dizimi kontrolü
        run: |
          set -e
          find website -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "Tüm PHP dosyaları geçerli."

      - name: Ayarları kontrol et
        id: cfg
        env:
          HAS_PASSWORD: ${{ secrets.FTP_PASSWORD != '' }}
        run: |
          if [ "$HAS_PASSWORD" != "true" ]; then
            echo "::warning::FTP_PASSWORD secret'ı tanımlı değil, yükleme atlandı. Settings → Secrets and variables → Actions → New repository secret."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: FTP'ye bağlan, klasör yapısını algıla ve yükle
        if: steps.cfg.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER || 'ftp.titaniumcam.com' }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME || 'skttitan' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_CERT_FINGERPRINT: ${{ vars.FTP_CERT_FINGERPRINT || '4C:E4:76:B9:3D:51:0B:EC:E2:F3:0D:2A:9B:1A:D2:22:79:BB:38:71' }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          sudo apt-get install -y -qq lftp > /dev/null

          # Ortak bağlantı ayarları: FTPS zorunlu; yalnızca sabitlenmiş sertifikaya güven.
          conn="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes"
          conn="$conn; set ssl:verify-certificate/$FTP_CERT_FINGERPRINT no"
          conn="$conn; set net:max-retries 2; set net:timeout 30"
          conn="$conn; open --env-password -u \"$FTP_USERNAME\" -p $FTP_PORT $FTP_SERVER"

          if ! listing=$(lftp -c "$conn; cls -1" 2>err.txt); then
            echo "::error::FTP bağlantısı kurulamadı: $(tr '\n' ' ' < err.txt)"
            if grep -qi 'certificate' err.txt; then
              echo "::error::Sunucu sertifikası sabitlenen sertifikadan farklı. Hosting firması sertifikayı yenilemiş olabilir; yeni parmak izini firmayla doğrulayıp FTP_CERT_FINGERPRINT değişkenine girin."
            elif grep -qiE 'login|530' err.txt; then
              echo "::error::Kullanıcı adı ($FTP_USERNAME) veya şifre (FTP_PASSWORD) hatalı."
            fi
            exit 1
          fi
          echo "Bağlantı başarılı (FTPS, sabitlenmiş sertifika)."
          echo "FTP kökündeki öğeler:"; echo "$listing" | sed 's/^/  /'

          # Sunucudaki yerleşimi belirle ve yükleme klasörünü hazırla.
          rm -rf deploy
          if echo "$listing" | grep -qE '^public_html/?$'; then
            echo "Giriş ev klasörüne açılıyor → site public_html/ içine, app/ ve storage/ yanına."
            web=deploy/public_html
          else
            echo "Giriş doğrudan web klasörüne açılıyor → app/ ve storage/ burada, .htaccess ile korumalı."
            web=deploy
          fi
          mkdir -p "$web" deploy/storage
          cp -a website/public/. "$web"/
          cp -a website/app deploy/app
          cp website/storage/.htaccess deploy/storage/.htaccess
          echo "Yüklenecek dosyalar:"; find deploy -type f | sort | sed 's/^/  /'

          # Yükle. --delete kullanılmaz: sunucudaki form kayıtları (storage/*.jsonl) korunur.
          lftp -c "$conn; mirror --reverse --verbose=1 --parallel=4 --no-perms deploy/ ./"
          echo "### Dosyalar FTP ile yüklendi ($FTP_SERVER)" >> "$GITHUB_STEP_SUMMARY"

      - name: Siteyi kontrol et
        if: steps.cfg.outputs.ready == 'true'
        env:
          SITE: ${{ vars.SITE_URL || 'titaniumcam.com' }}
        run: |
          host=${SITE#*://}; host=${host%/}
          for scheme in https http; do
            url="$scheme://$host"
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$url/ozellikler" || true)
            echo "$url/ozellikler → $code"
            if [ "$code" = "200" ]; then
              echo "### Site yayında: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::warning::Dosyalar yüklendi ancak site henüz açılmıyor. Alan adı yeni alındıysa DNS yayılması birkaç saat sürebilir; panelde PHP sürümünün 8.1+ olduğunu da kontrol edin."
